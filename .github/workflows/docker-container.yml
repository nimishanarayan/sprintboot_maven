name: Build Maven Docker and Push to ACR

on:
  push:
    branches:
      - main  # Change if needed

jobs:
  build:
    runs-on: self-hosted
    container:
      image: docker:24.0-dind  # Docker-in-Docker container
      options: --privileged      # Required for Docker inside container

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Azure login using Service Principal
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 3️⃣ Login to ACR
      - name: Login to ACR
        run: |
          az acr login --name myregistry  # Replace 'myregistry' with your ACR name

      # 4️⃣ Set Docker image tag as commit SHA
      - name: Set Docker Image Tag
        run: echo "IMAGE_TAG=${GITHUB_SHA}" >> $GITHUB_ENV

      # 5️⃣ Build Docker image (Maven build happens inside Dockerfile)
      - name: Build Docker Image
        run: docker build -t myregistry.azurecr.io/springbootimage:${{ github.sha }} .

      # 6️⃣ Push Docker image to ACR
      - name: Push Docker Image
        run: docker push myregistry.azurecr.io/springbootimage:${{ github.sha }}
