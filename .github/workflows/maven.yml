# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Build maven + Docker + Push to ACR

on:
  push:
    branches: [ "springboot3" ]
  pull_request:
    branches: [ "springboot3" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven
      - name: Set up Maven
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build with Maven
        run: mvn -B clean package

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
        
      - name: Login to ACR
        run: |
          az acr login --name springbootappmaven
          
      - name: Build Docker Image
        run: |
          docker buildx build --platform linux/amd64 -t springbootappmaven.azurecr.io/springbootdemoimage:${{ github.sha }} .
          docker tag springbootappmaven.azurecr.io/springbootdemoimage:${{ github.sha }} springbootappmaven.azurecr.io/springbootdemoimage:latest

      - name: Push image
        run: |
          docker push springbootappmaven.azurecr.io/springbootdemoimage:${{ github.sha }}
          docker tag springbootappmaven.azurecr.io/springbootdemoimage:${{ github.sha }} springbootappmaven.azurecr.io/springbootdemoimage:latest
          docker push springbootappmaven.azurecr.io/springbootdemoimage:latest

      - name: Set AKS Context
        uses: azure/aks-set-context@v3
        with:
            resource-group: ${{ secrets.AKS_RG }}
            cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}

      - name: Update Image Tag
        run: |
            sed -i "s|springbootdemoimage:latest|springbootdemoimage:${{ github.sha }}|g" k8s-deployment.yaml

      - name: Deploy to AKS
        run: kubectl apply -f k8s-deployment.yaml

