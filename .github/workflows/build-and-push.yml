name: Java CI with Maven

on:
  push:
    branches: [ "springboot3" ]
  pull_request:
    branches: [ "springboot3" ]
  workflow_dispatch:

jobs:
  build:

    runs-on: [self-hosted, windows]

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: C:\tools\apache-maven-3.9.12\bin\mvn.cmd -B package --file pom.xml

    - name: Login to Azure Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ secrets.ACR_LOGIN_SERVER }}
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: Build Docker image
      run: |
        docker build \
          -t ${{ secrets.ACR_LOGIN_SERVER }}/springboot-app:${{ github.sha }} \
          -t ${{ secrets.ACR_LOGIN_SERVER }}/springboot-app:latest \
          .

    - name: Push Docker image
      run: |
        docker push ${{ secrets.ACR_LOGIN_SERVER }}/springboot-app:${{ github.sha }}
        docker push ${{ secrets.ACR_LOGIN_SERVER }}/springboot-app:latest